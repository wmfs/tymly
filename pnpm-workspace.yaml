# Directories that lerna-sync clones Tymly repos into.
# This is the single source of truth: lib/sync.js generates lerna.json from it
# (lerna-sync still reads that file), and .pnpmfile.cjs uses it to find local packages.
packages:
  - packages/*
  - plugins/*
  - blueprints/*
  - cardscript/*
  - apps/*
  - mods/*
  - e2e/*

# sync and bootstrap install for themselves; don't install before every script
verifyDepsBeforeRun: false

# Dependencies allowed to run install scripts. pnpm refuses to install if a
# dependency with a script isn't listed here. Add new ones with `pnpm approve-builds`.
allowBuilds:
  canvas: true          # native binary
  sharp: true           # native binary + libvips
  sqlite3: true         # native binary
  wd: true              # generates files it needs at runtime
  vue-demi: true        # switches to the installed Vue version
  is-hidden-file: true  # native module (Windows only)
  core-js: false        # funding message only
  core-js-pure: false   # funding message only

# pnpm 12 won't install versions less than a day old. Our own packages are
# published constantly by semantic-release and picked up by Renovate within
# hours, so they're exempt.
minimumReleaseAgeExclude:
  - '@wmfs/*'
